[package]
name = "specmock-runtime-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
# A fuzz crate is a detached workspace, so it cannot inherit from the root
# `[workspace.dependencies]` and declares its dependencies directly.
http = "1.5.0"
libfuzzer-sys = "0.4.13"
serde_json = "1.0.151"
specmock-runtime = { path = ".." }

[[bin]]
name = "media_encode"
path = "fuzz_targets/media_encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "negotiate"
path = "fuzz_targets/negotiate.rs"
test = false
doc = false
bench = false

# Detached from the parent workspace: cargo-fuzz builds these targets with its
# own sanitizer/panic-abort profile.
[workspace]
