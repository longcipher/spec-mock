[package]
name = "specmock-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/specmock-core"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core types, schema validation, and deterministic data generation for spec-mock"

[dependencies]
# Default features are disabled deliberately: they enable `reqwest`,
# `resolve-http` and `tls-aws-lc-rs`, which drag in `rustls` and the
# `aws-lc-sys` C build. This crate only ever calls `validator_for` on a
# self-contained schema — `$ref` resolution is done by our own
# `ref_resolver` — so the network/file resolvers are never reachable.
jsonschema = { workspace = true, default-features = false }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_regex = { workspace = true }
scc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints.clippy]
# Inherit workspace lints but allow expect_used in test code
expect_used = "allow"

[dev-dependencies]
proptest = { workspace = true }
regex-lite = { workspace = true }
tempfile = { workspace = true }
